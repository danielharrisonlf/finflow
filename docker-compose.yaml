services:
  db:
    image: postgres:16-alpine
    container_name: finflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports:
      - "5435:5432"
    volumes:
      - finflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Banco descartável exclusivo para testes de integração (nome termina em _test)
  db_test:
    image: postgres:16-alpine
    container_name: finflow-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finflow_pgdata:

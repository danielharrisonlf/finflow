name: Release

# Publica os binários (6 plataformas) como assets da GitHub Release ao enviar uma tag v*.
#   git tag v0.2.0 && git push origin v0.2.0
# Os nomes dos assets não levam versão: .../releases/latest/download/finflow-windows-amd64.zip
# sempre aponta para a última release estável (tags com "-", como v0.3.0-rc.1, viram pre-release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check version policy (.claude/skills/finflow-release)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A tag estável precisa bater com a versão dos package.json e ter notas em docs/releases/.
          version="${TAG#v}"
          base="${version%%-*}"
          for f in package.json apps/web/package.json packages/contracts/package.json; do
            v=$(node -p "require('./$f').version")
            if [[ "$v" != "$base" ]]; then echo "::error::$f tem version $v, a tag pede $base"; exit 1; fi
          done
          if [[ "$TAG" != *-* && ! -f "docs/releases/$version.md" ]]; then
            echo "::error::faltam as notas docs/releases/$version.md"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build release archives
        run: node scripts/release.mjs "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Versão publicada é imutável: nunca reenvia assets de uma release existente.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release $TAG já existe; lance a próxima versão em vez de trocar os arquivos"; exit 1
          fi
          version="${TAG#v}"
          flags=(--verify-tag --title "FinFlow $TAG")
          if [[ -f "docs/releases/$version.md" ]]; then flags+=(--notes-file "docs/releases/$version.md"); else flags+=(--generate-notes); fi
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/release/* "${flags[@]}"

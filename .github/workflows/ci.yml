name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go build & tests (API, CLI, MCP)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
          POSTGRES_DB: finflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Roda a mesma suíte em SQLite (sempre) e em PostgreSQL (schema descartável por teste).
      FINFLOW_TEST_DATABASE_URL: postgres://finflow:finflow@localhost:5432/finflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: tests (race + cobertura, SQLite e PostgreSQL)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - run: go build -trimpath -ldflags="-s -w" -o finflow ./cmd/finflow
      # Runtime do navegador (docs/browser-runtime-contract.md §6): a API compilada para WebAssembly.
      - name: wasm (GOOS=js GOARCH=wasm) vet & build
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          go vet ./cmd/finflow-wasm/ ./internal/...
          go build -trimpath -ldflags="-s -w" -o finflow.wasm ./cmd/finflow-wasm
          ls -l finflow.wasm

  web-checks:
    name: Web lint, typecheck & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:web

  e2e:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finflow/contracts build
      - run: pnpm --filter @finflow/web test:e2e
        env:
          CI: "true"
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image (build + smoke, sem push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build --build-arg FINFLOW_VERSION=ci-${{ github.sha }} -t finflow:ci .
      - name: smoke (healthcheck e /api/system/info)
        run: |
          docker run -d --name finflow-ci -p 127.0.0.1:3333:3333 finflow:ci
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' finflow-ci)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' finflow-ci | grep -qx healthy
          curl -fsS http://127.0.0.1:3333/api/system/info
          curl -fsS http://127.0.0.1:3333/ | grep -q '<div id="root">'
          docker image ls finflow:ci
      - name: logs
        if: always()
        run: docker logs finflow-ci || true
      - run: docker compose --profile ai --profile postgres --profile test config -q

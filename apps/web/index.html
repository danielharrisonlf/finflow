<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <script id="finflow-theme-init">
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("finflow-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        const root = document.documentElement;
        root.classList.add(theme);
        root.dataset.theme = theme;
        root.dataset.themePreference = preference;
        root.style.colorScheme = theme;
        root.style.backgroundColor = dark ? "#09090b" : "#fafafa";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#09090b" : "#fafafa");
      })();
    </script>
    <title>FinFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Cpath d='M9 22V10h12M9 16h9' stroke='%2334d399' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
